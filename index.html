<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Primary SEO -->
    <title>TwentyEleven</title>
    <meta
      name="description"
      content="TwentyEleven is a product company building a family of SaaS and tech products that solve real, everyday problems. Feedu, our restaurant operating system, is the first."
    />
    <meta name="author" content="TwentyEleven" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://twentyeleven.in/" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/20eleven_logo.png" />
    <link rel="apple-touch-icon" href="/20eleven_logo.png" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TwentyEleven" />
    <meta property="og:title" content="TwentyEleven — A Product Company Building SaaS Products" />
    <meta
      property="og:description"
      content="A product company building the next generation of software products. We're starting with Feedu — the operating system for modern restaurants."
    />
    <meta property="og:url" content="https://twentyeleven.in/" />
    <meta property="og:image" content="https://twentyeleven.in/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TwentyEleven — A Product Company Building SaaS Products" />
    <meta
      name="twitter:description"
      content="A product company building the next generation of software products. Feedu, our restaurant operating system, is the first."
    />
    <meta name="twitter:image" content="https://twentyeleven.in/og.png" />

    <!-- Fonts: Space Grotesk (display) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Nunito:wght@400;700;800&family=Pacifico&display=swap"
    />

    <!-- Structured data: the company and its products -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "TwentyEleven",
        "url": "https://twentyeleven.in/",
        "logo": "https://twentyeleven.in/og.png",
        "description": "TwentyEleven is a product company building a family of SaaS and tech products that solve real, everyday problems.",
        "email": "sumit.k.budaniya@gmail.com",
        "makesOffer": {
          "@type": "Offer",
          "itemOffered": {
            "@type": "SoftwareApplication",
            "name": "Feedu",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "Restaurant Management Software",
            "url": "https://feedu.in/",
            "description": "The operating system for modern restaurants."
          }
        }
      }
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
